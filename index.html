<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>ud-tool</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>


<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="style.css"/>

</head>
<body>

<div id="toolbar">
    <button onclick="setMode2D()">2D</button>
    <button onclick="setMode3D()">3D</button>
    <button onclick="exportJSON()">Export JSON</button>
    <button onclick="exportCSV()">Export CSV</button>
</div>

<div id="map"></div>
<div id="three"></div>

<div id="sidebar">
    <h2>Plot Info</h2>
    <div id="plot-info">Click a plot</div>

    <h3>Attributes</h3>
    <label>Land Use:</label>
    <select id="landuse" onchange="updateAttributes()">
        <option value="residential">Residential</option>
        <option value="commercial">Commercial</option>
        <option value="mixed">Mixed Use</option>
        <option value="institutional">Institutional</option>
        <option value="empty">Empty</option>
    </select>

    <label>Floors:</label>
    <input type="number" id="floors" min="0" value="0" onchange="updateAttributes()"/>

    <label>Height (m):</label>
    <input type="number" id="height" min="0" value="0" onchange="updateAttributes()"/>

    <label>Notes:</label>
    <textarea id="notes" onchange="updateAttributes()"></textarea>
</div>

<div id="dashboard">
    <h2>Dashboard</h2>

    <canvas id="donut"></canvas>

    <div id="kpi">
        <div>Total Site Area: <span id="kpi-site"></span></div>
        <div>Total Road Area: <span id="kpi-road"></span></div>
        <div>Total Built-up Area: <span id="kpi-bua"></span></div>
        <div>FAR: <span id="kpi-far"></span></div>
    </div>

    <h3>Plot Summary</h3>
    <table id="summary-table">
        <thead>
            <tr>
                <th>ID</th><th>Use</th><th>Floors</th>
                <th>BUA</th><th>Area</th><th>FAR</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script src="app-2d.js"></script>
<script src="app-3d.js"></script>

<!-- ⭐ THIS WAS MISSING ⭐ -->
<script>
window.onload = function () {
    init2D();   // <-- Loads GeoJSON + Renders Plots + Activates Everything
};
</script>

</body>
</html>
